AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA4CWBTkPRfdDO0wAAAABJRU5ErkJggg==" alt="Café Idiomas"><span class="tag">ON VOYAGE ! · FLASH CARDS</span></header><main id="app"></main><footer><span>Café Idiomas · Francês para a vida real</span><span>16 frases essenciais, muitas viagens pela frente.</span></footer><script>
'use strict';
const categories=['Quando você não entende','Pedindo ajuda','Pedindo algo','Localização','Pagamento','Emergência'];
const cards=[
[0,'Pourriez-vous répéter ?','Poderia repetir?'],
[0,'Pourriez-vous parler plus lentement ?','Poderia falar mais devagar?'],
[0,'Pourriez-vous l’écrire ?','Poderia escrever isso?'],
[1,"Pourriez-vous m’aider ?",'Poderia me ajudar?'],
[1,'Je ne trouve pas...','Não consigo encontrar...'],
[1,'Il y a un problème avec...','Há um problema com...'],
[2,'Je voudrais...','Eu gostaria de...'],
[2,'Est-ce que je pourrais avoir... ?','Será que eu poderia pedir/receber...?'],
[2,'Je peux avoir... ?','Posso pedir/receber...?'],
[3,'Où est... ?','Onde fica...?'],
[3,'Comment aller à... ?','Como chegar a...?'],
[3,'C’est loin d’ici ?','É longe daqui?'],
[4,'C’est combien ?','Quanto custa?'],
[4,'Je peux payer par carte ?','Posso pagar com cartão?'],
[5,'Je ne me sens pas bien.','Não estou me sentindo bem.'],
[5,'J’ai perdu mon passeport / mes bagages.','Perdi meu passaporte / minha bagagem.']
].map((a,id)=>({id,category:a[0],fr:a[1],pt:a[2]}));
const app=document.getElementById('app');let selected=new Set(categories.map((_,i)=>i)),direction='pt',deck=[],initial=[],index=0,flipped=false,mode='home',round=1,reviewSet=new Set(),known=new Set(),streak=0,best=0,speed=.85,lastMessage='';
const audioSupported='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;let voices=[];
function loadVoices(){if(audioSupported)voices=speechSynthesis.getVoices()}loadVoices();if(audioSupported)speechSynthesis.addEventListener('voiceschanged',loadVoices);
function stopAudio(){if(audioSupported)speechSynthesis.cancel()}
function audio(text){if(!audioSupported){audioNotice('Áudio indisponível neste navegador. Você pode continuar praticando por leitura.');return}stopAudio();loadVoices();const voice=voices.find(v=>v.lang.toLowerCase()==='fr-fr')||voices.find(v=>v.lang.toLowerCase().startsWith('fr'));if(voices.length&&!voice){audioNotice('Ative uma voz de francês nas configurações de fala do aparelho para ouvir as frases.');return}const utterance=new SpeechSynthesisUtterance(text.replace(' / ','. Ou '));utterance.lang='fr-FR';utterance.rate=speed;if(voice)utterance.voice=voice;utterance.onerror=e=>{if(!['interrupted','canceled'].includes(e.error))audioNotice('Não foi possível reproduzir. Confira as vozes de francês do aparelho e tente novamente.')};audioNotice('');speechSynthesis.speak(utterance)}
function audioNotice(msg){const el=document.getElementById('audio-notice');if(el)el.textContent=msg}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function focusMain(){const title=app.querySelector('h1,h2');if(title){title.tabIndex=-1;title.focus({preventScroll:true})}window.scrollTo(0,0)}
function home(){stopAudio();mode='home';app.innerHTML=`<section class="hero"><div><div class="eyebrow">Um jogo para levar na memória</div><h1 lang="fr">Cartes <em>en poche !</em></h1><p class="lead">Pense, vire e descubra. Colecione as frases que você já lembra e dê mais uma chance às que precisam de prática.</p><span class="tag">16 FLASH CARDS · 6 CATEGORIAS</span></div><div class="deck-art" aria-hidden="true"><div class="mini-card"></div><div class="mini-card"></div><div class="mini-card"><small>CAFÉ IDIOMAS</small><span class="spark">✦</span>Je voudrais...<small>SEU FRANCÊS NA BAGAGEM</small></div></div></section><section class="panel"><div class="section-title"><h2>Monte seu baralho</h2><button class="text-btn" id="all">Selecionar todas</button></div><div class="filters">${categories.map((c,i)=>`<label class="filter"><input type="checkbox" data-cat="${i}" ${selected.has(i)?'checked':''}><span>${c}</span><small>${cards.filter(x=>x.category===i).length}</small></label>`).join('')}</div><div class="controls"><label class="select">Lado inicial<select id="direction"><option value="pt">Português → francês</option><option value="fr">Francês → português</option></select></label><button class="btn primary" id="start">Começar jogo →</button></div><p class="small" id="selection-count" style="margin:15px 0 0"></p></section><div class="instruction"><span aria-hidden="true">✦</span><span><b>Seu desafio:</b> lembrar de todas as frases do baralho. Sem cronômetro, sem perder vidas. As cartas são embaralhadas a cada rodada.</span></div><details class="guide"><summary>Como jogar e usar o áudio</summary><p>Leia a frente e tente dizer o outro lado em voz alta. Clique na carta para revelar. Depois, escolha “Lembrei!” ou “Quero revisar”. Ao final, você pode jogar só com as cartas que quer revisar.</p><p>As estrelas e a sequência seguem sua própria avaliação; o jogo não verifica a resposta falada nem usa o microfone. Pequenas variações de tradução podem estar corretas.</p><p>O botão de áudio lê a frase em francês. No sentido português → francês, ele aparece após revelar a resposta. A voz depende do navegador e das vozes francesas do aparelho; algumas precisam de internet.</p><p>As reticências indicam frases para completar com o que você precisa. Na última carta, a barra separa duas possibilidades: passaporte ou bagagem. O progresso vale apenas para o jogo aberto e não é salvo ao atualizar a página.</p></details>`;
document.getElementById('direction').value=direction;document.getElementById('direction').onchange=e=>direction=e.target.value;document.querySelectorAll('[data-cat]').forEach(el=>el.onchange=()=>{const id=Number(el.dataset.cat);el.checked?selected.add(id):selected.delete(id);selectionCount()});document.getElementById('all').onclick=()=>{selected=new Set(categories.map((_,i)=>i));home()};document.getElementById('start').onclick=()=>start();selectionCount();focusMain()}
function selectionCount(){const n=cards.filter(c=>selected.has(c.category)).length;document.getElementById('selection-count').textContent=n?`${n} cartas nesta partida · Cerca de ${Math.max(1,Math.ceil(n/3))} minutos por rodada`:'Selecione pelo menos uma categoria para jogar.';document.getElementById('start').disabled=!n}
function start(){const chosen=cards.filter(c=>selected.has(c.category));if(!chosen.length)return;initial=chosen;known=new Set();reviewSet=new Set();round=1;streak=0;best=0;lastMessage='';deck=shuffle(chosen);index=0;flipped=false;mode='play';renderCard();window.scrollTo(0,0)}
function renderCard(){mode='play';const card=deck[index];const front=direction==='pt'?card.pt:card.fr;const back=direction==='pt'?card.fr:card.pt;const visible=flipped?back:front;const lang=(direction==='pt')!==flipped?'pt-BR':'fr';app.innerHTML=`<div class="toolbar"><button class="btn" id="home">← Início</button><div class="settings"><span>Rodada ${round}${round>1?' · Revisão':''}</span><label>Voz <select id="speed" aria-label="Velocidade da voz"><option value="0.7">Devagar</option><option value="0.85">Tranquila</option><option value="1">Normal</option></select></label></div></div><h1 class="sr">Flash cards em jogo</h1><div class="stats"><span><b>${index+1}/${deck.length}</b> carta</span><span><b>★ ${known.size}/${initial.length}</b> lembradas</span><span><b>${streak}</b> em sequência</span></div><div class="progress" role="progressbar" aria-label="Cartas respondidas na rodada" aria-valuemin="0" aria-valuemax="${deck.length}" aria-valuenow="${index}"><div style="width:${index/deck.length*100}%"></div></div><section class="card-wrap"><p class="toast" role="status">${lastMessage}</p><button class="flashcard ${flipped?'revealed':''}" id="flip" aria-label="${flipped?'Resposta':'Frente'}: ${visible} — ${flipped?'ver frente':'revelar resposta'}"><span class="category">${categories[card.category]}</span><span class="phrase" lang="${lang}">${visible}</span><span class="card-note">${flipped?'RESPOSTA · Clique para ver a frente':'Pense na resposta · Clique para virar ↻'}</span></button><div class="audio-row">${flipped||direction==='fr'?'<button class="btn" id="listen">▷ Ouvir em francês</button>':'<span class="small">O áudio em francês aparece depois de virar.</span>'}</div><div class="notice" id="audio-notice" role="status"></div><p class="answer-hint">${flipped?'Como foi? Marque de acordo com o que você lembrou antes de virar.':'Tente responder em voz alta antes de revelar.'}</p><div class="rating"><button class="btn" id="review" ${flipped?'':'disabled'}>↻ Quero revisar</button><button class="btn orange" id="known" ${flipped?'':'disabled'}>★ Lembrei!</button></div><p class="keyboard">Teclado: espaço vira a carta · 1 revisa · 2 marca “Lembrei!”<br>Autoavaliação: não há reconhecimento de voz.</p></section>`;
document.getElementById('home').onclick=home;document.getElementById('speed').value=String(speed);document.getElementById('speed').onchange=e=>speed=Number(e.target.value);document.getElementById('flip').onclick=flip;document.getElementById('review').onclick=()=>rate(false);document.getElementById('known').onclick=()=>rate(true);const listen=document.getElementById('listen');if(listen){listen.onclick=()=>audio(card.fr);listen.disabled=!audioSupported}if(!audioSupported)audioNotice('Áudio indisponível neste navegador. Continue praticando por leitura.');document.getElementById('flip').focus({preventScroll:true})}
function flip(){if(mode!=='play')return;stopAudio();flipped=!flipped;renderCard()}
function rate(remembered){if(mode!=='play'||!flipped)return;stopAudio();const c=deck[index];if(remembered){known.add(c.id);reviewSet.delete(c.id);streak++;best=Math.max(best,streak);lastMessage=streak>1?`Très bien ! ${streak} frases lembradas em sequência.`:'Très bien ! Mais uma frase na bagagem.'}else{known.delete(c.id);reviewSet.add(c.id);streak=0;lastMessage='Combinado! Essa frase volta na rodada de revisão.'}index++;flipped=false;if(index===deck.length)finish();else renderCard()}
function reviewRound(){if(!reviewSet.size)return;deck=shuffle(initial.filter(c=>reviewSet.has(c.id)));index=0;flipped=false;round++;streak=0;lastMessage='Uma nova chance de colocar estas frases na memória.';renderCard();window.scrollTo(0,0)}
function finish(){mode='done';const all=known.size===initial.length;app.innerHTML=`<section class="done"><div class="eyebrow">Rodada ${round} concluída</div><div class="medal" aria-hidden="true">${all?'✦':'☆'}</div><h1 lang="fr">${all?'Bravo, voyageur !':'On continue ?'}</h1><p class="lead">${all?'Você marcou todas as frases como lembradas. Seu baralho está na bagagem!':'Cada repetição conta. Jogue outra rodada com as frases que você quer reforçar.'}</p><div class="summary"><div><b>${known.size}/${initial.length}</b><span class="small">lembradas por você</span></div><div><b>${best}</b><span class="small">melhor sequência</span></div><div><b>${reviewSet.size}</b><span class="small">para revisar</span></div></div><div class="actions">${reviewSet.size?'<button class="btn primary" id="retry">Revisar estas cartas →</button>':''}<button class="btn ${all?'primary':''}" id="restart">↻ Jogar novamente</button><button class="btn" id="home">Escolher categorias</button></div></section><section class="review panel"><h2>Sua coleção de frases</h2><p class="small">Abra uma frase para conferir a tradução e ouvir o francês.</p>${initial.map(c=>`<details><summary>${known.has(c.id)?'★':'↻'} ${c.pt}</summary><p lang="fr">${c.fr}</p><p class="small">${categories[c.category]}</p><button class="btn" data-audio="${c.id}" ${audioSupported?'':'disabled'}>▷ Ouvir em francês</button></details>`).join('')}<p class="notice" id="audio-notice" role="status"></p></section>`;document.getElementById('home').onclick=home;document.getElementById('restart').onclick=start;const retry=document.getElementById('retry');if(retry)retry.onclick=reviewRound;document.querySelectorAll('[data-audio]').forEach(b=>b.onclick=()=>audio(cards[Number(b.dataset.audio)].fr));focusMain()}
document.addEventListener('keydown',e=>{if(mode!=='play'||e.repeat||e.altKey||e.ctrlKey||e.metaKey)return;if(['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.code==='Space'&&e.target.id==='flip'){e.preventDefault();flip()}else if(e.key==='1'){e.preventDefault();rate(false)}else if(e.key==='2'){e.preventDefault();rate(true)}});window.addEventListener('pagehide',stopAudio);home();
</script></body></html>
